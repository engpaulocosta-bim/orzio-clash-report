name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Inspect golden files
        shell: pwsh
        run: |
          function Show-GoldenInfo($label, $path) {
            Write-Host $label
            Get-ChildItem $path -File | Sort-Object Name | ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $crlf = 0
              for ($i = 0; $i -lt $bytes.Length - 1; $i++) {
                if ($bytes[$i] -eq 13 -and $bytes[$i + 1] -eq 10) {
                  $crlf++
                }
              }
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ("{0} crlf={1} sha256={2}" -f $_.Name, $crlf, $hash)
            }
          }

          Show-GoldenInfo "Source goldens" "tests/OrzioClashReport.Tests/Golden"
          Show-GoldenInfo "Output goldens" "tests/OrzioClashReport.Tests/bin/Release/net8.0/Golden"

      - name: Test
        run: dotnet test --configuration Release --no-build

  windows-packaging-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Re-checkout golden files with LF
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git checkout -- tests/OrzioClashReport.Tests/Golden

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish win-x64 single-file CLI
        run: >
          dotnet publish src/OrzioClashReport.Cli/OrzioClashReport.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish/win-x64
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/publish/win-x64/orzioclash.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Published executable was not produced: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -le 0) {
            throw "Published executable is empty: $exe"
          }

      - name: Run release smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/publish/win-x64/orzioclash.exe"
          $workspace = Join-Path $env:RUNNER_TEMP "orzio-release-smoke"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          scripts/smoke-release.ps1 -ExecutablePath $exe -SmokeWorkspace $workspace
