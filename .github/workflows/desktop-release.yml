name: Desktop auto release

# One desktop release per launcher version. The version lives only in src/LauncherVersion.props.
#
# - pull_request: plan only. Reports the tag a merge would publish, and warns when the PR changes
#   shipped code without raising a version that is already published.
# - push to master: publishes desktop-v<version> when that release does not exist yet. A merge that
#   leaves the version unchanged publishes nothing.
# - workflow_dispatch on master: retries a failed publication; it never replaces a published version.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan desktop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prefix: ${{ steps.plan.outputs.prefix }}
      tag: ${{ steps.plan.outputs.tag }}
      previous-tag: ${{ steps.plan.outputs.previous-tag }}
      should-publish: ${{ steps.plan.outputs.should-publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and existing publication
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & ./scripts/get-launcher-version.ps1
          $tag = $version.Tag

          $tags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list existing releases.' }
          $published = $tags -contains $tag

          $desktopTags = @($tags | Where-Object { $_ -like 'desktop-v*' -and $_ -ne $tag })
          $previous = if ($desktopTags.Count -gt 0) { $desktopTags[0] } else { '' }

          if (-not $published) {
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to query remote tags.' }
            if ($remoteTag) { throw "Tag $tag already exists without a release. Resolve it by hand; it is never replaced." }
          }

          "version=$($version.Full)" >> $env:GITHUB_OUTPUT
          "prefix=$($version.Prefix)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "previous-tag=$previous" >> $env:GITHUB_OUTPUT
          "should-publish=$(if ($published) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

          $summary = @("## Desktop release plan", "", "| | |", "|---|---|",
            "| Version | ``$($version.Full)`` |", "| Tag | ``$tag`` |",
            "| Already published | $(if ($published) { 'yes' } else { 'no' }) |")

          if ($env:EVENT_NAME -eq 'pull_request') {
            $changed = @(git diff --name-only "$env:BASE_SHA...HEAD")
            $shipped = @($changed | Where-Object { $_ -match '^(src|installer|scripts)/' })
            if ($published -and $shipped.Count -gt 0) {
              Write-Host "::warning title=Desktop version not raised::This PR changes shipped files but $tag is already published, so merging it will not create a desktop release. Raise LauncherVersionPrefix or LauncherVersionSuffix in src/LauncherVersion.props to ship it."
              $summary += "| On merge | nothing is published (version unchanged) |"
            } elseif (-not $published) {
              Write-Host "::notice title=Desktop release on merge::Merging this PR into master publishes $tag."
              $summary += "| On merge | publishes ``$tag`` |"
            } else {
              $summary += "| On merge | nothing is published |"
            }
          }

          $summary -join "`n" >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Publish desktop release
    needs: plan
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/master'
      && needs.plan.outputs.should-publish == 'true'
    runs-on: windows-2025
    permissions:
      contents: write
    concurrency:
      group: desktop-release-master
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore
          if ($LASTEXITCODE -ne 0) { throw "Restore failed." }
          dotnet build --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
          dotnet test --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }

      - name: Check Windows installer compiler
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            throw "Inno Setup 6 is unavailable on this Windows runner."
          }

      - name: Publish desktop and engine
        shell: pwsh
        run: scripts/publish-launcher.ps1

      - name: Verify the published launcher reports the planned version
        shell: pwsh
        env:
          RELEASE_PREFIX: ${{ needs.plan.outputs.prefix }}
        run: |
          $exe = 'artifacts/launcher/staging/OrzioClashReport.Launcher.Desktop.exe'
          $productVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith($env:RELEASE_PREFIX)) {
            throw "Launcher product version '$productVersion' does not start with the planned version $env:RELEASE_PREFIX."
          }
          Write-Host "Launcher product version: $productVersion"

      - name: Package desktop installer
        shell: pwsh
        run: scripts/package-launcher.ps1

      - name: Generate verified update manifest
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerName = "orzio-clash-report-desktop-v$($env:RELEASE_VERSION)-win-x64-setup.exe"
          $folder = Join-Path $PWD 'artifacts/launcher/installer'
          $installer = Join-Path $folder $installerName
          $checksum = "$installer.sha256"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer is missing: $installer" }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw "Installer checksum is missing." }
          if ((Get-Item -LiteralPath $installer).Length -le 0) { throw "Installer is empty." }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$hash  $installerName"
          if ((Get-Content -LiteralPath $checksum -Raw).Trim() -ne $expected) {
            throw "Installer checksum does not match the actual installer."
          }
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            installerUrl = "$baseUrl/download/$env:RELEASE_TAG/$installerName"
            sha256 = $hash
            releaseNotesUrl = "$baseUrl/tag/$env:RELEASE_TAG"
          }
          $manifestPath = Join-Path $folder 'orzio-clash-update-manifest.json'
          [System.IO.File]::WriteAllText(
            $manifestPath, ($manifest | ConvertTo-Json -Depth 3),
            [System.Text.UTF8Encoding]::new($false))
          $saved = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($saved.version -ne $env:RELEASE_VERSION -or $saved.sha256 -ne $hash) {
            throw "Update manifest validation failed."
          }
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT

      - name: Retain installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orzio-clash-desktop-${{ needs.plan.outputs.version }}
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30

      - name: Create official desktop GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous-tag }}
          INSTALLER: ${{ steps.package.outputs.installer }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          MANIFEST: ${{ steps.package.outputs.manifest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path $env:RUNNER_TEMP 'desktop-release-notes.md'
          @"
          Orzio Clash Report desktop $env:RELEASE_VERSION.

          This release contains the Windows installer, SHA-256 checksum and update manifest.
          Updates are checked only on user request and downloaded installers are SHA-256 verified.
          The installer is not currently code signed; Windows SmartScreen may warn.
          User projects, exports and reports are not included in this release.
          Experimental features remain subject to the limitations documented in the repository.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            $env:INSTALLER, $env:CHECKSUM, $env:MANIFEST,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Orzio Clash Report desktop $env:RELEASE_VERSION",
            '--notes-file', $notes,
            '--generate-notes')
          if ($env:PREVIOUS_TAG) { $arguments += @('--notes-start-tag', $env:PREVIOUS_TAG) }
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Desktop release publication failed." }
