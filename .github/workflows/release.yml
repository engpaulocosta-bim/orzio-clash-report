name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish win-x64 single-file CLI
        run: >
          dotnet publish src/OrzioClashReport.Cli/OrzioClashReport.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish/win-x64
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Run release smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/publish/win-x64/orzioclash.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Published executable was not produced: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -le 0) {
            throw "Published executable is empty: $exe"
          }

          $workspace = Join-Path $env:RUNNER_TEMP "orzio-release-smoke"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          scripts/smoke-release.ps1 -ExecutablePath $exe -SmokeWorkspace $workspace

      - name: Verify release identity
        id: identity
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/publish/win-x64/orzioclash.exe"
          $versionLine = & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read application version."
          }
          if ($versionLine -notmatch '^orzioclash (?<version>[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.]+)$') {
            throw "Unexpected version output: $versionLine"
          }

          $appVersion = $Matches["version"]
          $expectedTag = "v$appVersion"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag '${{ github.ref_name }}' does not match application version '$expectedTag'."
          }

          "app-version=$appVersion" >> $env:GITHUB_OUTPUT
          "expected-tag=$expectedTag" >> $env:GITHUB_OUTPUT

      - name: Verify tagged commit belongs to master
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit is not contained in origin/master."
          }

      - name: Assemble release package
        id: package
        shell: pwsh
        run: |
          $appVersion = "${{ steps.identity.outputs.app-version }}"
          $packageName = "orzio-clash-report-v$appVersion-win-x64"
          $packageRoot = Join-Path $PWD "artifacts/package/$packageName"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "docs/operations") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "samples") | Out-Null

          Copy-Item -LiteralPath "artifacts/publish/win-x64/orzioclash.exe" -Destination (Join-Path $packageRoot "orzioclash.exe")
          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $packageRoot "README.md")
          Copy-Item -LiteralPath "CHANGELOG.md" -Destination (Join-Path $packageRoot "CHANGELOG.md")
          Copy-Item -LiteralPath "docs/operations/internal-preview.md" -Destination (Join-Path $packageRoot "docs/operations/internal-preview.md")
          Copy-Item -LiteralPath "docs/operations/identity-governance-cli.md" -Destination (Join-Path $packageRoot "docs/operations/identity-governance-cli.md")
          Copy-Item -LiteralPath "docs/operations/identity-governance-validation.md" -Destination (Join-Path $packageRoot "docs/operations/identity-governance-validation.md")
          Copy-Item -LiteralPath "docs/operations/identity-governance-review-report.md" -Destination (Join-Path $packageRoot "docs/operations/identity-governance-review-report.md")
          Copy-Item -LiteralPath "docs/operations/pilot-evaluation.md" -Destination (Join-Path $packageRoot "docs/operations/pilot-evaluation.md")
          Copy-Item -LiteralPath "docs/operations/project-catalog.md" -Destination (Join-Path $packageRoot "docs/operations/project-catalog.md")
          Copy-Item -LiteralPath "docs/operations/release-checklist.md" -Destination (Join-Path $packageRoot "docs/operations/release-checklist.md")
          Copy-Item -LiteralPath "scripts/smoke-release.ps1" -Destination (Join-Path $packageRoot "smoke-release.ps1")
          Copy-Item -LiteralPath "samples/sample-clash.xml" -Destination (Join-Path $packageRoot "samples/sample-clash.xml")
          Copy-Item -LiteralPath "samples/sample-clash.run-manifest.json" -Destination (Join-Path $packageRoot "samples/sample-clash.run-manifest.json")
          Copy-Item -LiteralPath "samples/run-manifest.sample.json" -Destination (Join-Path $packageRoot "samples/run-manifest.sample.json")
          Copy-Item -LiteralPath "samples/run-index.template.json" -Destination (Join-Path $packageRoot "samples/run-index.template.json")

          $expectedFiles = @(
            "CHANGELOG.md",
            "README.md",
            "docs/operations/identity-governance-cli.md",
            "docs/operations/identity-governance-review-report.md",
            "docs/operations/identity-governance-validation.md",
            "docs/operations/internal-preview.md",
            "docs/operations/pilot-evaluation.md",
            "docs/operations/project-catalog.md",
            "docs/operations/release-checklist.md",
            "orzioclash.exe",
            "samples/run-index.template.json",
            "samples/run-manifest.sample.json",
            "samples/sample-clash.run-manifest.json",
            "samples/sample-clash.xml",
            "smoke-release.ps1"
          ) | Sort-Object

          $actualFiles = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File | ForEach-Object {
            $_.FullName.Substring($packageRoot.Length + 1).Replace('\', '/')
          } | Sort-Object)

          if ($actualFiles.Count -ne $expectedFiles.Count) {
            throw "Package file count mismatch. Expected $($expectedFiles.Count), actual $($actualFiles.Count)."
          }

          for ($i = 0; $i -lt $expectedFiles.Count; $i++) {
            if (-not [string]::Equals($actualFiles[$i], $expectedFiles[$i], [StringComparison]::Ordinal)) {
              throw "Unexpected packaged file set. Expected '$($expectedFiles[$i])', actual '$($actualFiles[$i])'."
            }
          }

          $pdbFiles = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "*.pdb")
          if ($pdbFiles.Count -ne 0) {
            throw "PDB files must not be included in the release package."
          }

          $forbiddenFiles = @($actualFiles | Where-Object {
            $_ -match '(^|/)\.(derived-html-report|identity-governance-replace|run-index-replace)-' -or
            $_ -match '\.tmp$' -or
            $_ -match '\.(nwd|nwf|nwc|rvt|pdf|png|jpg|jpeg|gif)$'
          })
          if ($forbiddenFiles.Count -ne 0) {
            throw "Forbidden files were included in the package: $($forbiddenFiles -join ', ')"
          }

          $zipPath = Join-Path $PWD "artifacts/$packageName.zip"
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $zipPath

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $zipEntries = @($zip.Entries | Where-Object { $_.FullName -notmatch '/$' } | ForEach-Object {
              $_.FullName.Replace('\', '/')
            } | Sort-Object)

            if ($zipEntries.Count -ne $expectedFiles.Count) {
              throw "ZIP entry count mismatch. Expected $($expectedFiles.Count), actual $($zipEntries.Count)."
            }

            for ($i = 0; $i -lt $expectedFiles.Count; $i++) {
              if (-not [string]::Equals($zipEntries[$i], $expectedFiles[$i], [StringComparison]::Ordinal)) {
                throw "Unexpected ZIP contents. Expected '$($expectedFiles[$i])', actual '$($zipEntries[$i])'."
              }
            }
          }
          finally {
            $zip.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $PWD "artifacts/$packageName.sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $packageName.zip" -NoNewline -Encoding ascii

          $checksumText = Get-Content -LiteralPath $checksumPath -Raw
          if ($checksumText -notmatch "^[0-9a-f]{64}  $([regex]::Escape($packageName)).zip$") {
            throw "Checksum file format is invalid."
          }

          "zip-path=$zipPath" >> $env:GITHUB_OUTPUT
          "checksum-path=$checksumPath" >> $env:GITHUB_OUTPUT
          "package-name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.package-name }}
          path: |
            ${{ steps.package.outputs.zip-path }}
            ${{ steps.package.outputs.checksum-path }}
          if-no-files-found: error

  publish-prerelease:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/release
          merge-multiple: true

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repository = "${{ github.repository }}"
          $expectedPrefix = "orzio-clash-report-$tag-win-x64"
          $zipPath = Join-Path $PWD "artifacts/release/$expectedPrefix.zip"
          $checksumPath = Join-Path $PWD "artifacts/release/$expectedPrefix.sha256"

          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Expected ZIP artifact was not downloaded: $zipPath"
          }
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Expected checksum artifact was not downloaded: $checksumPath"
          }

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$tag' already exists."
          }

          $notes = @"
          Internal controlled pilot release candidate.

          Includes the operational project catalog workflow: create-project, append-project-snapshot, and render-project.
          Includes the human identity-governance JSON workflow: create-identity-governance, append-identity-decision, validate-identity-governance, and render-identity-governance-report.
          Human decisions remain explicit confirmations and explicit rejections only.
          Evidence validation remains read-only.
          Review HTML remains standalone, deterministic, and local.
          Run snapshots remain immutable evidence, safe persistence preserves original bytes on failure, and the explicit run index remains the only authority for run order.
          Packaging smoke covers project catalog creation, append-only index updates, governance creation, governance append, read-only validation, and review rendering by repeating anonymized fixtures only. That smoke is not real longitudinal validation with three real exports.
          Single-run parsing, grouping, and HTML were human-validated on one private real export.
          Longitudinal matching, lifecycle, continuity links, continuity paths, and longitudinal HTML have not been validated on three real historical exports.
          Matching, lifecycle, and continuity remain experimental.
          Limitations remain explicit: no Clash Ledger, no Reopened, no automatic propagation, no transitivity, no graph merge, no inferred chronology, no automatic responsibility, no interactive review, no database, no multi-user workflow, and no auth.
          Privacy: the review report does not project raw ClashObject.SourceModel, the package contains anonymized fixtures only, outputs remain local, and real data requires authorization.
          "@

          gh release create $tag `
            $zipPath `
            $checksumPath `
            --repo $repository `
            --title "OrzioClashReport $tag" `
            --notes $notes `
            --prerelease
